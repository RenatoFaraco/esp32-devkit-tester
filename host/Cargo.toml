[workspace]

[package]
name = "esp32-devkit-tester"
version = "0.0.1"
edition = "2024"
rust-version = "1.88"
license = "MIT"
description = "Plug in an ESP32 dev board, press a key, and get a Jest-style PASS/FAIL report (UART, JTAG, registers, memory) in a terminal UI."
repository = "https://github.com/RenatoFaraco/esp32-devkit-tester"
readme = "../README.md"
keywords = ["esp32", "embedded", "tui", "hardware-testing", "espressif"]
categories = ["embedded", "command-line-utilities", "development-tools::testing", "hardware-support"]

[lib]
name = "esp32_devkit_tester"
path = "src/lib.rs"

[[bin]]
name = "devkit-tester"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.105"
# ROM bootloader protocol (ADR-002). Library API only: no `cli` feature (no SemVer guarantee).
# Pinned exactly: 4.5.0 is the last release with MSRV 1.88; `probe/espflash.rs` and
# `probe/rdid.rs` were written against its source (guarded by tests/layering.rs).
espflash = { version = "=4.5.0", default-features = false, features = ["serialport"] }
ratatui = "0.30"
serialport = { version = "4.10", features = ["usbportinfo-interface"] }

[dev-dependencies]
# Only to read test fixtures (FakeProbe); promoted to [dependencies] by the JSON report (#24).
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# Only to build espflash's private connection errors (timeout, device not found) in the
# `map_err` tests, through espflash's public `From<SlipError>`. Same version espflash uses.
slip-codec = "=0.4.0"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
